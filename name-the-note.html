<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name the Note</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <a id="back" class="back" href="instrument.html">&larr; Activities</a>
  <header>
    <div id="eyebrow" class="eyebrow"></div>
    <h1>Name the Note</h1>
    <p>Look at where the note sits on the stave, then pick its name.</p>
  </header>

  <section class="card" aria-label="Practice note">
    <div id="noteName" class="note-name">?</div>
    <svg id="stave" class="stave" role="img" aria-label="Bass clef stave showing a note to name"></svg>
    <div class="status" aria-live="polite">
      <span id="msg" class="msg">Which note is this?</span>
      <button id="next" class="alt-btn" type="button" hidden>Next note</button>
    </div>
  </section>

  <section class="controls" aria-label="Answer">
    <div class="field" id="accField" hidden>
      <div class="field-head"><span class="label" id="accLabel">Sharp or flat?</span></div>
      <div class="seg" role="group" aria-labelledby="accLabel">
        <button type="button" data-acc="" aria-pressed="true" aria-label="Natural">&#9838;</button>
        <button type="button" data-acc="#" aria-pressed="false" aria-label="Sharp">&#9839;</button>
        <button type="button" data-acc="b" aria-pressed="false" aria-label="Flat">&#9837;</button>
      </div>
    </div>

    <div id="letters" class="letters" role="group" aria-label="Note name">
      <button type="button" data-letter="A">A</button>
      <button type="button" data-letter="B">B</button>
      <button type="button" data-letter="C">C</button>
      <button type="button" data-letter="D">D</button>
      <button type="button" data-letter="E">E</button>
      <button type="button" data-letter="F">F</button>
      <button type="button" data-letter="G">G</button>
    </div>
    <p class="hint">Keyboard: press A to G to answer, # for sharp, &minus; for flat, Enter for the next note.</p>

    <div class="scorebar">
      <span id="score">Score 0 / 0 &middot; Streak 0</span>
      <button id="reset" class="link-btn" type="button">Reset score</button>
    </div>
  </section>

  <section class="controls" aria-label="Settings">
    <div class="field">
      <div class="field-head"><label for="range">Range</label></div>
      <select id="range"></select>
    </div>
    <label class="switch" for="accidentals">
      <input id="accidentals" type="checkbox" role="switch">
      <span class="track" aria-hidden="true"></span>
      <span>Include sharps and flats</span>
    </label>
    <label class="switch" for="sound">
      <input id="sound" type="checkbox" role="switch" checked>
      <span class="track" aria-hidden="true"></span>
      <span>Play the note when I answer</span>
    </label>
  </section>

  <footer id="footnote"></footer>
</div>

<script src="common.js"></script>
<script src="instruments.js"></script>
<script src="name-the-note.js"></script>
</body>
</html>
