<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5E82"/><stop offset="1" stop-color="#14263A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C265" stop-opacity=".30"/><stop offset="1" stop-color="#F2C265" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" gradientUnits="userSpaceOnUse" x1="0" y1="-110" x2="0" y2="45">
      <stop offset="0" stop-color="#FFE7A8"/><stop offset=".4" stop-color="#E7AE45"/><stop offset="1" stop-color="#B97A14"/>
    </linearGradient>
    <path id="slideOuter" d="M -60 70 H -282 A 18 18 0 0 0 -282 106 H -60"/>
    <path id="slideTop" d="M -60 70 H 118"/>
    <path id="slideBottom" d="M -60 106 H 118"/>
    <path id="bellTubes" d="M -78 -30 H 160 A 18 18 0 0 1 160 6 H 112 V 66"/>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#glow)"/>

  <!-- stave lines and notes as a backdrop -->
  <g stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2">
    <line x1="0" x2="800" y1="440" y2="440"/><line x1="0" x2="800" y1="470" y2="470"/>
    <line x1="0" x2="800" y1="500" y2="500"/><line x1="0" x2="800" y1="530" y2="530"/>
    <line x1="0" x2="800" y1="560" y2="560"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".14">
    <ellipse cx="90" cy="500" rx="15" ry="11" transform="rotate(-18 90 500)" stroke="none"/><line x1="104" x2="104" y1="498" y2="440" stroke-width="3"/>
    <ellipse cx="660" cy="470" rx="15" ry="11" transform="rotate(-18 660 470)" stroke="none"/><line x1="674" x2="674" y1="468" y2="410" stroke-width="3"/>
    <ellipse cx="730" cy="530" rx="15" ry="11" transform="rotate(-18 730 530)" stroke="none"/><line x1="744" x2="744" y1="528" y2="470" stroke-width="3"/>
  </g>

  <g transform="translate(400 292) rotate(-15) scale(1.1) translate(40 -4)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- slide: outer tubes and far bow -->
    <use xlink:href="#slideOuter" stroke="#7A4D08" stroke-width="19"/>
    <use xlink:href="#slideOuter" stroke="#E7AE45" stroke-width="14"/>
    <use xlink:href="#slideOuter" stroke="#FFE7A8" stroke-width="3" transform="translate(0 -3.5)"/>
    <!-- slide: chrome inner tubes -->
    <use xlink:href="#slideTop" stroke="#56677A" stroke-width="12"/>
    <use xlink:href="#slideTop" stroke="#DCE5EC" stroke-width="8"/>
    <use xlink:href="#slideBottom" stroke="#56677A" stroke-width="12"/>
    <use xlink:href="#slideBottom" stroke="#DCE5EC" stroke-width="8"/>
    <!-- slide brace and stockings -->
    <rect x="-160" y="62" width="12" height="52" rx="5" fill="#E7AE45" stroke="#7A4D08" stroke-width="3"/>
    <rect x="-70" y="58" width="16" height="56" rx="6" fill="#E7AE45" stroke="#7A4D08" stroke-width="3"/>

    <!-- bell section tubes and bow -->
    <use xlink:href="#bellTubes" stroke="#7A4D08" stroke-width="19"/>
    <use xlink:href="#bellTubes" stroke="#E7AE45" stroke-width="14"/>
    <use xlink:href="#bellTubes" stroke="#FFE7A8" stroke-width="3" transform="translate(0 -3.5)"/>
    <rect x="48" y="-40" width="12" height="54" rx="5" fill="#E7AE45" stroke="#7A4D08" stroke-width="3"/>

    <!-- bell flare -->
    <path d="M -74 -38 C -122 -42 -170 -66 -200 -98 L -200 38 C -170 14 -122 -16 -74 -22 Z" fill="url(#flare)" stroke="#7A4D08" stroke-width="4"/>
    <path d="M -90 -30 C -130 -34 -165 -52 -190 -80" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="4"/>
    <ellipse cx="-200" cy="-30" rx="20" ry="68" fill="#6B4208" stroke="#FFE7A8" stroke-width="5"/>
    <ellipse cx="-198" cy="-30" rx="11" ry="54" fill="#2E1B03" fill-opacity=".7" stroke="none"/>

    <!-- leadpipe and mouthpiece -->
    <path d="M 118 106 H 150" stroke="#56677A" stroke-width="12"/>
    <path d="M 118 106 H 150" stroke="#DCE5EC" stroke-width="8"/>
    <path d="M 148 99 L 200 101 Q 216 106 200 111 L 148 113 Z" fill="#DCE5EC" stroke="#56677A" stroke-width="3"/>
    <ellipse cx="206" cy="106" rx="5" ry="8" fill="#FFFFFF" stroke="#56677A" stroke-width="2.5"/>
  </g>
</svg>
