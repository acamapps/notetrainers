<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6A68"/><stop offset="1" stop-color="#112B2D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2C265" stop-opacity=".30"/><stop offset="1" stop-color="#F2C265" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flare" gradientUnits="userSpaceOnUse" x1="46" y1="-60" x2="156" y2="22">
      <stop offset="0" stop-color="#FFE7A8"/><stop offset=".45" stop-color="#E7AE45"/><stop offset="1" stop-color="#B97A14"/>
    </linearGradient>
    <path id="body" d="M 0 -150 V 112 C 0 205 100 205 100 112 V 22"/>
    <path id="neck" d="M 0 -150 C 0 -192 -12 -216 -48 -230"/>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#glow)"/>

  <!-- stave lines and notes as a backdrop -->
  <g stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2">
    <line x1="0" x2="800" y1="60" y2="60"/><line x1="0" x2="800" y1="90" y2="90"/>
    <line x1="0" x2="800" y1="120" y2="120"/><line x1="0" x2="800" y1="150" y2="150"/>
    <line x1="0" x2="800" y1="180" y2="180"/>
  </g>
  <g fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".14">
    <ellipse cx="110" cy="150" rx="15" ry="11" transform="rotate(-18 110 150)" stroke="none"/><line x1="124" x2="124" y1="148" y2="90" stroke-width="3"/>
    <ellipse cx="190" cy="105" rx="15" ry="11" transform="rotate(-18 190 105)" stroke="none"/><line x1="204" x2="204" y1="103" y2="45" stroke-width="3"/>
    <ellipse cx="690" cy="135" rx="15" ry="11" transform="rotate(-18 690 135)" stroke="none"/><line x1="704" x2="704" y1="133" y2="75" stroke-width="3"/>
  </g>

  <g transform="translate(400 334) rotate(10) scale(1.06) translate(-52 8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- neck -->
    <use xlink:href="#neck" stroke="#7A4D08" stroke-width="21"/>
    <use xlink:href="#neck" stroke="#E7AE45" stroke-width="15"/>
    <!-- mouthpiece -->
    <g transform="translate(-48 -230) rotate(-158.7)">
      <path d="M 0 -9 L 26 -11 L 62 -6 Q 72 0 62 6 L 26 11 L 0 9 Z" fill="#1C1C1F" stroke="#000" stroke-width="2"/>
      <rect x="8" y="-13" width="14" height="26" rx="3" fill="#DCE5EC" stroke="#56677A" stroke-width="2"/>
    </g>
    <!-- body, bow and bell tube -->
    <use xlink:href="#body" stroke="#7A4D08" stroke-width="45"/>
    <use xlink:href="#body" stroke="#E7AE45" stroke-width="39"/>
    <use xlink:href="#body" stroke="#FFE7A8" stroke-width="5" transform="translate(-10 0)"/>
    <use xlink:href="#body" stroke="#B97A14" stroke-width="5" transform="translate(11 0)" opacity=".7"/>
    <rect x="-17" y="-160" width="34" height="14" rx="5" fill="#B97A14" stroke="#7A4D08" stroke-width="3"/>

    <!-- bell flare -->
    <path d="M 80 24 C 79 -12 62 -34 47 -56 L 156 -61 C 140 -36 121 -12 120 24 Z" fill="url(#flare)" stroke="#7A4D08" stroke-width="4"/>
    <ellipse cx="101" cy="-59" rx="55" ry="15" transform="rotate(-5 101 -59)" fill="#6B4208" stroke="#FFE7A8" stroke-width="5"/>
    <ellipse cx="101" cy="-58" rx="42" ry="9" transform="rotate(-5 101 -58)" fill="#2E1B03" fill-opacity=".7" stroke="none"/>

    <!-- key rod, arms and pads -->
    <path d="M -36 -122 V 92" stroke="#7A4D08" stroke-width="6"/>
    <path d="M -36 -122 V 92" stroke="#E7AE45" stroke-width="3"/>
    <g stroke="#7A4D08" stroke-width="3">
      <line x1="-36" x2="-12" y1="-110" y2="-110"/><line x1="-36" x2="-12" y1="-72" y2="-72"/>
      <line x1="-36" x2="-12" y1="-34" y2="-34"/><line x1="-36" x2="-12" y1="4" y2="4"/>
      <line x1="-36" x2="-12" y1="42" y2="42"/><line x1="-36" x2="-12" y1="80" y2="80"/>
    </g>
    <g fill="#F7DD93" stroke="#7A4D08" stroke-width="3">
      <circle cx="0" cy="-110" r="11"/><circle cx="0" cy="-72" r="11"/><circle cx="0" cy="-34" r="11"/>
      <circle cx="0" cy="4" r="11"/><circle cx="0" cy="42" r="11"/><circle cx="0" cy="80" r="11"/>
      <circle cx="100" cy="62" r="10"/><circle cx="100" cy="92" r="10"/>
    </g>
    <g fill="#E7AE45" stroke="#7A4D08" stroke-width="2">
      <circle cx="-36" cy="-122" r="5"/><circle cx="-36" cy="-30" r="5"/><circle cx="-36" cy="40" r="5"/><circle cx="-36" cy="92" r="5"/>
    </g>
    <!-- neck strap ring -->
    <circle cx="26" cy="-52" r="7" stroke="#7A4D08" stroke-width="4"/>
  </g>
</svg>
