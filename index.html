<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note Practice</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note Practice">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <header>
    <div class="eyebrow">Choose your instrument</div>
    <h1>Note Practice</h1>
    <p>Read the stave, name the notes and hear how they sound on your instrument.</p>
  </header>

  <nav id="instruments" class="picker" aria-label="Instruments"></nav>

  <footer>Runs entirely in your browser. No data is sent anywhere.</footer>
</div>

<script src="common.js"></script>
<script src="instruments.js"></script>
<script>
/* One picture card per instrument in instruments.js. The card is only the picture, which comes from the
   instrument's "image" setting. If there is no image, or the file cannot be loaded, a drawn stave with the
   instrument's name is shown instead, so the card is never blank. */
(function () {
  var list = document.getElementById("instruments");

  function plain(art, inst) {
    var d = inst.demo.trainer;
    art.className = "pick-art plain";
    art.innerHTML = '<svg class="stave" aria-hidden="true"></svg>' +
      '<div class="pick-name">' + (inst.emoji ? inst.emoji + " " : "") + inst.name + "</div>";
    TN.mini(art.querySelector("svg"), inst, d, d[0] + TN.accSymbol(d[1]));
  }

  TN.INSTRUMENT_ORDER.forEach(function (id) {
    var inst = TN.INSTRUMENTS[id];
    var a = document.createElement("a");
    a.className = "pick";
    a.href = "instrument.html?i=" + id;
    a.title = inst.name;

    var art = document.createElement("div");
    art.className = "pick-art";
    if (inst.image) {
      var img = document.createElement("img");
      img.alt = inst.name;                            // the card has no text, so this names the link
      img.decoding = "async";
      if (inst.imageFocus) img.style.objectPosition = inst.imageFocus;
      img.addEventListener("error", function () { plain(art, inst); });
      img.src = inst.image;
      art.appendChild(img);
    } else {
      plain(art, inst);
    }
    a.appendChild(art);
    list.appendChild(a);
  });
})();
</script>
</body>
</html>
